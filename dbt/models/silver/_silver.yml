version: 2

models:
  - name: stg_crawl_product_price
    description: >
      Tahap pembersihan pertama dari raw: teks harga dan diskon diubah menjadi angka,
      ukuran kemasan dinormalisasi ke satuan dasar (ml, g, pcs), dan dibuat kunci
      pencocokan produk (match_key) yang tidak peka urutan kata, huruf besar-kecil,
      maupun penulisan satuan.
    columns:
      - name: raw_id
        description: Kunci baris di raw.
        data_tests: [unique, not_null]
      - name: price_idr
        description: Harga dalam rupiah (angka). Kosong bila teks harga tidak ada.
      - name: pack_unit_base
        description: Satuan dasar kemasan (ml untuk ml/L, g untuk g/kg, pcs).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ml', 'g', 'pcs']
      - name: match_key
        description: >
          Kata-kata nama produk (tanpa ukuran dan kata promosi) diurutkan, digabung dengan
          ukuran dasar. Produk yang sama di platform berbeda menghasilkan kunci yang sama.
        data_tests: [not_null]

  - name: silver_price_observation
    description: >
      Satu baris per listing per hari. Bila ada beberapa crawl di hari yang sama,
      crawl terbaru dipakai. Baris bermasalah tidak dibuang, melainkan ditandai
      lewat is_valid dan dq_issue; layer gold hanya memakai baris valid.
    columns:
      - name: listing_key
        description: Hash dari platform dan source_url (satu listing produk di satu platform).
        data_tests: [not_null]
      - name: product_key
        description: Kunci produk kanonik hasil pencocokan.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_product_master')
                field: product_key
      - name: platform
        data_tests:
          - accepted_values:
              arguments:
                values: ['Klik Indomaret', 'Blibli', 'Tokopedia']
      - name: discount_pct
        description: Diskon dihitung dari harga dan harga asli (bukan dari teks diskon).
      - name: dq_issue
        description: Jenis masalah kualitas data; kosong berarti baris valid.
        data_tests:
          - accepted_values:
              arguments:
                values: ['price_missing', 'price_not_positive', 'discount_out_of_range', 'price_gt_original']
      - name: is_valid
        data_tests: [not_null]

  - name: silver_product_master
    description: >
      Satu baris per produk kanonik. Brand dari daftar brand (seed), kategori dari
      pemetaan breadcrumb platform yang tidak ambigu (seed), nama kanonik dari nama
      pertama yang terlihat (prioritas Blibli, Klik Indomaret, lalu Tokopedia).
    columns:
      - name: product_key
        data_tests: [unique, not_null]
      - name: brand
        data_tests: [not_null]
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Bumbu & Masakan', 'Minuman', 'Perawatan Rambut', 'Sabun Mandi', 'Perawatan Mulut', 'Deterjen & Pembersih', 'Tidak terklasifikasi']
      - name: n_platforms
        description: Jumlah platform tempat produk ini ditemukan.
        data_tests:
          - accepted_values:
              arguments:
                values: [2, 3]
                quote: false
