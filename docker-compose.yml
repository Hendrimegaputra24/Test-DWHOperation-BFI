# Satu perintah:  docker compose up --build
# Urutan: db -> pipeline (skema, muat data, dbt, rekomendasi) -> api
#
# OPSIONAL: Airflow (penjadwal) tidak ikut menyala secara bawaan. Nyalakan dengan:
#   docker compose --profile airflow up -d --build     (UI: http://localhost:8088)
x-app: &app
  build: .
  image: price-analytics:local
  env_file: .env
  environment:
    DB_HOST: db
    DB_PORT: "5432"

services:
  db:
    image: postgres:16
    container_name: price_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    <<: *app
    container_name: price_pipeline
    command: ["python", "src/pipeline.py"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    container_name: price_api
    command: ["python", "-m", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      pipeline:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  metabase:
    image: metabase/metabase:latest
    container_name: price_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Asia/Jakarta
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      pipeline:
        condition: service_completed_successfully

  # Airflow = penjadwal: menjalankan ulang crawl -> dbt build -> rekomendasi tiap malam pukul 01.00.
  # Hanya menyala dengan:  docker compose --profile airflow up -d --build
  airflow:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: price-airflow:local
    container_name: price_airflow
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/data/airflow.db
    ports:
      - "${AIRFLOW_PORT:-8088}:8080"
    volumes:
      - airflow-data:/opt/airflow/data
    depends_on:
      pipeline:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

volumes:
  pgdata:
  metabase-data:
  airflow-data:
